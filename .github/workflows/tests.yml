name: Tests

on:
  push:
    branches:
      - master
      - production
    paths:
      - "EXPRESS/**"
      - "REACT/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - master
      - production
    paths:
      - "EXPRESS/**"
      - "REACT/**"
      - ".github/workflows/tests.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: ${{ matrix.app.name }} Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        app:
          - name: EXPRESS
            path: EXPRESS
            test_command: npm test
          - name: REACT
            path: REACT
            test_command: npm test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app.path }}/package-lock.json

      - name: Install deps
        run: npm install
        working-directory: ${{ matrix.app.path }}

      - name: Add Rollup binary
        if: matrix.app.name == 'EXPRESS'
        run: npm install --no-save @rollup/rollup-linux-x64-gnu
        working-directory: ${{ matrix.app.path }}

      - name: Run tests
        run: ${{ matrix.app.test_command }}
        working-directory: ${{ matrix.app.path }}
